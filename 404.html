<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found &ndash; UGC Rate Calculator</title>
    <meta name="robots" content="noindex" />
    <!-- 同款 emoji favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>" />
    <link rel="stylesheet" href="/src/assets/legal.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <!-- 404 兜底页：dist 根的 404.html 是 Cloudflare Pages 约定的 404 fallback
         （缺此文件时未匹配路径会返回 index.html + 200，线上已实测）。
         纯 HTML+CSS 无 JS，样式复用 legal.css，工具类限于 privacy/terms 已用集合
         （legal.css 的 Tailwind @source 未含本文件，未出现过的类不会被生成）。
         错误页保持极简：noindex、无 GA4/canonical/JSON-LD。 -->
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-4">
        <span class="text-lg font-bold">UGC Toolkit</span>
        <a href="/" class="text-indigo-600 hover:underline">&larr; Back to calculator</a>
      </div>
    </header>
    <main class="mx-auto max-w-3xl px-4 py-10">
      <h1 class="text-3xl font-bold">404 &ndash; Page not found</h1>
      <p class="mt-4 leading-relaxed">The page you&rsquo;re looking for doesn&rsquo;t exist or has moved.</p>
      <p class="mt-10">
        <a href="/" class="text-lg font-bold text-indigo-600 hover:underline">&larr; Back to the calculator</a>
      </p>
    </main>
  </body>
</html>
